/* ================= Liquid glass theme ================= */
:root,:root[data-theme="dark"]{--bg1:#060A17;--bg2:#0B1230;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.085);--soft:rgba(255,255,255,.10);--line:rgba(255,255,255,.16);
 --gb:rgba(255,255,255,.13);--gh:rgba(255,255,255,.10);--gs:0 14px 40px rgba(0,0,0,.35);--blur:blur(20px) saturate(160%);
 --o1:rgba(251,113,133,.30);--o2:rgba(167,139,250,.30);--o3:rgba(56,189,248,.22);--o4:rgba(52,211,153,.18)}
:root[data-theme="light"]{--bg1:#EDF0FA;--bg2:#E3E8F7;--card:rgba(255,255,255,.58);--card2:rgba(255,255,255,.78);--soft:rgba(20,27,45,.09);--line:rgba(20,27,45,.14);
 --gb:rgba(255,255,255,.85);--gh:rgba(255,255,255,.65);--gs:0 14px 36px rgba(60,70,120,.14);--o1:rgba(251,113,133,.25);--o2:rgba(167,139,250,.28);--o3:rgba(56,189,248,.22);--o4:rgba(52,211,153,.16)}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
body::before{content:"";position:fixed;top:-20vmax;right:-20vmax;bottom:-20vmax;left:-20vmax;inset:-20vmax;z-index:-1;pointer-events:none;
 background:radial-gradient(38vmax 38vmax at 12% 8%,var(--o1),transparent 60%),radial-gradient(42vmax 42vmax at 92% 12%,var(--o2),transparent 60%),
  radial-gradient(40vmax 40vmax at 78% 88%,var(--o3),transparent 60%),radial-gradient(36vmax 36vmax at 8% 82%,var(--o4),transparent 60%);filter:blur(10px);animation:orbs 28s ease-in-out infinite alternate}
@keyframes orbs{to{transform:translate3d(2vmax,-2vmax,0) scale(1.05)}}
/* glass surfaces */
.glass,.panel,.kpi,.card,.scheme,.tc,.st,.side,.tpanel,.datap,.ic,.act,.share,.lgi,.cbig,.tipb,.lockbox,.stale,.dirty,.vbanner{
 background:linear-gradient(180deg,var(--gh),rgba(255,255,255,0) 55%),var(--card)!important;border:1px solid var(--gb)!important;box-shadow:var(--gs),inset 0 1px 0 var(--gh)!important;
 -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.panel,.card,.scheme,.st,.side,.ic,.tc{border-radius:22px!important}
.tipb{border-radius:14px!important}
.gbar{background:var(--bg1)!important;background:color-mix(in srgb,var(--bg1) 55%,transparent)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--gb)!important}
h1{letter-spacing:-.02em}
h2{font-size:21px}
/* interactive controls */
.btn,.seg button,.dbtn,.themebtn,.mini,.cexp,.sect,.bbtn{position:relative;overflow:hidden;transition:transform .15s ease,background .2s,box-shadow .2s,border-color .2s}
.btn,.themebtn,.mini,.cexp,.dbtn{background:linear-gradient(180deg,var(--gh),rgba(255,255,255,0)),var(--card2)!important;border:1px solid var(--gb)!important;box-shadow:inset 0 1px 0 var(--gh)}
.btn:hover,.themebtn:hover,.mini:hover,.cexp:hover,.dbtn:hover,.seg button:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.18),inset 0 1px 0 var(--gh)}
.btn:active,.themebtn:active,.mini:active,.cexp:active,.dbtn:active,.seg button:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,rgba(251,113,133,0.60),rgba(167,139,250,0.60))!important;background:linear-gradient(135deg,color-mix(in srgb,#FB7185 60%,transparent),color-mix(in srgb,#A78BFA 60%,transparent))!important;color:#fff;border-color:rgba(255,255,255,.25)!important}
.seg{background:var(--card)!important;border:1px solid var(--gb)!important;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:14px!important}
.seg button{border-radius:10px!important}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.45),rgba(255,255,255,0) 70%);transform:scale(0);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(2.4);opacity:0}}
/* drawer */
.drawer-tab{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:70;width:30px;height:72px;border-radius:0 16px 16px 0;cursor:pointer;color:var(--text);font-size:22px;font-weight:700;
 background:linear-gradient(180deg,var(--gh),rgba(255,255,255,0)),var(--card2);border:1px solid var(--gb);border-left:0;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--gs);transition:left .3s ease,width .2s}

.scrim{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:68;background:rgba(5,8,20,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.scrim[hidden]{display:none}
.drawer{position:fixed;left:0;top:0;bottom:0;width:320px;z-index:69;transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
 padding-top:calc(18px + env(safe-area-inset-top,0px));background:linear-gradient(180deg,var(--gh),rgba(255,255,255,0) 40%),var(--bg1);background:linear-gradient(180deg,var(--gh),rgba(255,255,255,0) 40%),color-mix(in srgb,var(--bg1) 70%,transparent);border-right:1px solid var(--gb);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);box-shadow:var(--gs)}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:17px}
.dsec{margin-bottom:18px}.dlab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}

.dsearch{width:100%;background:var(--card2);border:1px solid var(--gb);border-radius:10px;padding:8px 10px;color:var(--text);font:inherit;font-size:13px;margin-bottom:10px}

.modechip{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--gb)}
.modechip.tl{color:#FBBF24}
.topr{gap:8px}
/* status strip */
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.st{display:flex;align-items:center;gap:14px;padding:14px 16px}

.stbar{position:relative;height:10px;border-radius:6px;background:var(--soft);margin:8px 0 4px;overflow:visible}
.stbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#FB7185,#A78BFA)}
.stbar span{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.4}
/* overview */
.overview{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:14px;align-items:start}

.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ic{padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:default}
.ic:hover{transform:translateY(-3px)}
.ich{display:flex;align-items:center;gap:8px}.ici{font-size:18px}.icl{font-size:12.5px;color:var(--muted);font-weight:600}
.icv{font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.icd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icx{font-size:12px;color:var(--muted)}
.side{padding:14px 16px}
.sbh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:14px}
.side .act{grid-template-columns:22px 64px 1fr;padding:8px 10px;font-size:12.5px;box-shadow:none!important}
.hl{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--soft);font-size:13px}
.hlv{font-size:20px;min-width:34px;text-align:center;font-weight:700}
/* heatmap */
.heat{border-collapse:separate;border-spacing:4px}
.heat td,.heat th{border:0}
.heat td.hc{text-align:center;font-weight:700;border-radius:10px;min-width:96px}
.heat tr[data-hp]{cursor:pointer;transition:transform .15s}
.heat tr[data-hp]:hover td:first-child b{text-decoration:underline}
.hdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:0}
/* cards */
.card{border-top:3px solid var(--pc)!important}
.cstat{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--soft);border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.5}
.cexp{border-radius:12px;height:36px;cursor:pointer;color:var(--text);font-size:12.5px;font-weight:600}
.cdet{display:flex;flex-direction:column;gap:14px;animation:fadein .25s ease}
.cdet[hidden]{display:none}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.card.flash{box-shadow:0 0 0 3px var(--pc),var(--gs)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 60%,transparent),var(--gs)!important}
#cardCtrl{margin-bottom:12px}
.spk{flex:none}
.sgrid td .spk{display:block;margin:4px auto 0}
/* terminology */
.term{border-bottom:1.5px dotted currentColor;border-bottom:1.5px dotted color-mix(in srgb,currentColor 55%,transparent);cursor:help;outline:none}
.term:hover,.term:focus{border-bottom-style:solid;color:rgba(167,139,250,0.85);color:color-mix(in srgb,#A78BFA 60%,var(--text))}
/* section open animation */
.sec .secb{animation:fadein .25s ease}

.icd .spk{width:70px}

.cals{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cal{padding:12px 14px;border-radius:18px!important}
.calh{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;margin-bottom:8px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cd{min-height:44px;border-radius:9px;background:var(--card2);border:1px solid var(--soft);padding:3px 4px;display:flex;flex-direction:column;gap:2px;font-size:11px}
.cd.empty{background:transparent;border:0}
.cd.has{border-color:rgba(167,139,250,0.55);border-color:color-mix(in srgb,#A78BFA 55%,transparent);background:rgba(167,139,250,0.85);background:color-mix(in srgb,#A78BFA 12%,var(--card2));cursor:pointer}
.cd.has:hover,.cd.has:focus{outline:2px solid rgba(167,139,250,0.70);outline:2px solid color-mix(in srgb,#A78BFA 70%,transparent)}
.cdn{color:var(--muted);font-weight:600}.cde{display:flex;flex-wrap:wrap;gap:1px;align-items:center}.cde i{font-style:normal;font-size:13px;line-height:1}.cde b{font-size:10px}
.evt{padding:4px 0;border-top:1px solid var(--soft)}.evt:first-child{border-top:0}
/* ===== profile real numbers & badges ===== */
.rnum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rnum>span{background:var(--card2);border:1px solid var(--soft);border-radius:10px;padding:6px 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;line-height:1.3}
.rnum b{font-size:13.5px;color:var(--text)}.rnum i{font-style:normal;font-size:10.5px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;cursor:help;background:var(--card2);border:1.5px solid var(--pc);border:1.5px solid color-mix(in srgb,var(--pc) 60%,transparent);box-shadow:0 0 0 3px rgba(128,128,140,0.11);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 12%,transparent);transition:transform .15s}
.bdg:hover,.bdg:focus{transform:translateY(-2px) scale(1.06);outline:none}
.sub3{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:1px}
@media (max-width:560px){.rnum{grid-template-columns:repeat(2,1fr)}}
@media print{.cal,.pin{background:#fff!important;box-shadow:none!important;border:1px solid #d7dce8!important}#cmpPick,#cmpDay{display:none!important}.bdg{box-shadow:none}}

.twl.sm{width:13px;height:13px;margin-right:4px;vertical-align:-2px}
.twl.md{width:18px;height:18px;margin:0 0 0 8px;vertical-align:-2px}
.twl.lg{width:22px;height:22px;border-radius:6px;margin-right:2px}
.seg.tp button .small{margin-left:4px;opacity:.7}
.nm{display:flex;align-items:center}
.seg.tp button i.twl,.seg button i.twl{width:14px;height:14px;border-radius:4px;margin-right:5px}
/* ===== icons ===== */
.ico{display:inline-block;vertical-align:-3px;flex:none}
.hico{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,rgba(129,140,248,0.30),rgba(34,211,238,0.22));background:linear-gradient(135deg,color-mix(in srgb,#818CF8 30%,transparent),color-mix(in srgb,#22D3EE 22%,transparent));border:1px solid var(--gb);color:var(--text)}
:root[data-theme="light"] .hico{background:linear-gradient(135deg,#EEF2FF,#E0F2FE);color:#3730A3}
.sect::before{display:none!important}
.sec.closed .hico{opacity:.6}
.ici,.rich{color:rgba(129,140,248,0.85);color:color-mix(in srgb,#818CF8 70%,var(--text))}
/* ===== tabs ===== */
.tabs{display:flex;gap:6px;margin:14px 0 4px;padding:6px;border-radius:16px;background:var(--card);border:1px solid var(--gb);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);position:sticky;top:calc(var(--gbh,56px) + 6px);z-index:20}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:12px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:background .2s,color .2s}
.tabs button:hover{color:var(--text);background:var(--card2)}
.tabs button[aria-selected="true"]{color:#fff;background:linear-gradient(135deg,#6366F1,#8B5CF6);box-shadow:0 6px 18px rgba(99,102,241,.35)}
:root[data-theme="light"] .tabs button[aria-selected="true"]{background:linear-gradient(135deg,#4F46E5,#2563EB)}
.tabs button[hidden]{display:none}
.sec.tabhide{display:none!important}
.rkv[hidden]{display:none}
#rkView{margin-bottom:12px}
/* ===== drawer nav groups ===== */
.dnt{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 10px 2px}
.dnav a{display:flex;align-items:center;gap:8px}.dnav a.cur{color:var(--text)}
/* ===== sticky mini KPIs ===== */
.gmini{display:none;gap:14px;align-items:center;margin-left:auto;font-size:12.5px;color:var(--muted)}
.gmini b{color:var(--text)}
body.scrolled .gmini{display:flex}
body.scrolled .gbar .mem{display:none}
/* ===== info notes ===== */
.noteh{display:none!important}
.noteq{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 10px;border-radius:999px;border:1px solid var(--gb);background:var(--card2);color:var(--muted);font:inherit;font-size:11.5px;font-weight:600;cursor:help}
.noteq:hover{color:var(--text)}
/* ===== focus panel ===== */
.fscrim{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:78;background:rgba(5,8,20,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.fscrim[hidden]{display:none}
.fpanel{position:fixed;right:0;top:0;bottom:0;width:min(460px,94vw);z-index:79;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));padding-top:calc(18px + env(safe-area-inset-top,0px));
 background:linear-gradient(180deg,var(--gh),rgba(255,255,255,0) 40%),var(--bg1);
 background:linear-gradient(180deg,var(--gh),rgba(255,255,255,0) 40%),color-mix(in srgb,var(--bg1) 78%,transparent);border-left:1px solid var(--gb);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);box-shadow:var(--gs);display:flex;flex-direction:column;gap:14px}
:root[data-theme="light"] .fpanel{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.78))}
.fpanel.open{transform:none}
#fbody{display:flex;flex-direction:column;gap:14px}
.fh{display:flex;align-items:center;gap:12px}.fh .av{width:44px;height:44px;font-size:18px}
.fn{font-size:18px;font-weight:800;display:flex;align-items:center;gap:4px}
.fperf{margin-left:auto;text-align:right}.fperf b{display:block;font-size:26px;line-height:1}
.fsec{background:var(--card);border:1px solid var(--gb);border-radius:16px;padding:12px 14px}
.fsh{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.fev{display:flex;flex-direction:column;gap:8px}.fevi{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.fpl{cursor:pointer}.fpl:hover b,.nm.fpl:hover{text-decoration:underline;text-decoration-color:rgba(129,140,248,0.70);text-decoration-color:color-mix(in srgb,#818CF8 70%,transparent);text-underline-offset:3px}
/* ===== compact density ===== */
body.compact .panel,body.compact .card,body.compact .ic,body.compact .st,body.compact .side,body.compact .tc,body.compact .scheme,body.compact .rec,body.compact .cal{padding:10px 12px!important}
body.compact h2{font-size:17px;margin:20px 0 10px}body.compact .hico{width:26px;height:26px}
body.compact .icv{font-size:21px}body.compact .stv{font-size:18px}body.compact .stbig{font-size:28px}
body.compact .icards,body.compact .status,body.compact .tgrid,body.compact .cards,body.compact .recs{gap:8px}
body.compact .noteq,body.compact .tleg,body.compact .lleg,body.compact .icx,body.compact .sec h2 small{display:none!important}

/* ================= motion layer (scroll reveal) ================= */
@keyframes aRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes aPop{0%{opacity:0;transform:scale(.94) translateY(14px)}60%{opacity:1;transform:scale(1.012)}100%{opacity:1;transform:none}}
@keyframes aGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes aWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes aCell{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes aSheen{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes aTick{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* waiting state: only applied by script, removed again after the element has animated in */
.rvA{opacity:0}
.rvB>i{transform:scaleX(0);transform-origin:left center}.rvB .tk{opacity:0}
.rvC{clip-path:inset(0 100% 0 0)}
.rvD td.hc{opacity:0}
.rvA.in{animation:aPop .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--ai,0)*70ms)}
.rvB.in>i{animation:aGrow .95s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--ai,0)*60ms + 120ms)}
.rvB.in .tk{animation:aTick .4s ease .8s both}
.rvC.in{animation:aWipe 1.1s cubic-bezier(.3,.7,.2,1) both;animation-delay:calc(var(--ai,0)*60ms + 100ms)}
.rvD.in td.hc{animation:aCell .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--ai,0)*16ms)}
.pgb>i:not(.pj){position:relative;overflow:hidden}
.pgb.rvB.in>i:not(.pj)::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:aSheen .9s ease-out 1s both}
/* micro-interactions (always on) */
.kpi,.tc,.act,#app .card{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.kpi:hover,.tc:hover,.act:hover{transform:translateY(-3px)}
.kpi .emo{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.kpi:hover .emo{transform:scale(1.14) rotate(-6deg)}
.btn:active,.seg button:active,#tabs button:active,.dbtn:active{transform:scale(.96)}
.heat td.hc{transition:transform .15s,box-shadow .15s}
.heat td.hc:hover{transform:scale(1.07);box-shadow:0 6px 16px rgba(0,0,0,.18);position:relative;z-index:2}
.cbar i,.bar i,.pgb>i{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.fpanel.open #fbody>*{animation:aRise .4s cubic-bezier(.2,.8,.2,1) both}
.fpanel.open #fbody>*:nth-child(2){animation-delay:60ms}.fpanel.open #fbody>*:nth-child(3){animation-delay:120ms}.fpanel.open #fbody>*:nth-child(4){animation-delay:180ms}.fpanel.open #fbody>*:nth-child(n+5){animation-delay:240ms}
@media (prefers-reduced-motion:reduce){.fpanel.open #fbody>*{animation:none!important}.kpi:hover,.tc:hover,.act:hover,.heat td.hc:hover,.kpi:hover .emo{transform:none}}

/* group lock */
.gl-gate{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:9999;display:grid;place-items:center;padding:16px;background:radial-gradient(60vmax 60vmax at 80% 0%,rgba(128,128,140,0.20),transparent 70%),var(--bg,#F5F6FA);background:radial-gradient(60vmax 60vmax at 80% 0%,color-mix(in srgb,var(--accent,#4F46E5) 22%,transparent),transparent 70%),var(--bg,#F5F6FA)}
.gl-card{width:min(400px,100%);display:grid;gap:12px;background:var(--card2,#fff);border:1px solid var(--line,#E2E5EE);border-radius:20px;padding:26px 24px;box-shadow:0 24px 60px rgba(20,24,60,.18);color:var(--ink,#151A2D)}
.gl-card h2{margin:0;font-size:20px}.gl-card p{margin:0;color:var(--muted,#596079);font-size:14px;line-height:1.5}.gl-ic{font-size:28px}
.gl-card label{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted,#596079)}
.gl-card select,.gl-card input{font:inherit;font-size:15px;padding:11px 12px;border-radius:12px;border:1px solid var(--line,#D6DAE6);background:var(--card,#fff);color:var(--ink,#151A2D)}
.gl-card .btn{justify-self:stretch;padding:12px;font-size:15px}.gl-err{min-height:18px;color:var(--bad,#D23B4E);font-size:13px;font-weight:600}
.gl-chip{display:inline-flex;align-items:center;gap:8px;margin:6px 0 2px;padding:4px 6px 4px 12px;border-radius:999px;font-size:12.5px;font-weight:700;background:rgba(128,128,140,0.11);background:color-mix(in srgb,var(--accent,#4F46E5) 12%,transparent);color:var(--accent,#4F46E5)}
.gl-chip button{font:inherit;font-size:12px;font-weight:600;border:0;border-radius:999px;padding:3px 10px;background:var(--card2,#fff);color:var(--ink,#151A2D);cursor:pointer}
.gl-set{margin-top:14px;padding:14px;border:1px solid var(--line,#E2E5EE);border-radius:14px;background:var(--card,#fff)}
.gl-rows{display:grid;gap:8px}.gl-rows label{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.gl-rows input{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line,#D6DAE6);background:var(--card2,#fff);color:inherit;min-width:0}
.gl-warn{color:var(--bad,#D23B4E);font-size:12.5px;font-weight:600;margin-bottom:6px}
@media (max-width:520px){.gl-rows label{grid-template-columns:minmax(0,1fr)}}

/* calculator: compact */
#calc .crow4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#calc .crow4 input{min-width:0}
#calc .thr button{height:24px;font-size:11px}
#calc .cfield{gap:4px}
.csum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.csum>div{background:var(--card2);border:1px solid var(--soft);border-radius:12px;padding:9px 10px;text-align:center;display:flex;flex-direction:column;gap:1px;justify-content:center}
.csum b{font-size:19px;line-height:1.2}.csum span b{font-size:inherit;line-height:inherit}.csum .tt{background:var(--accent);background:color-mix(in srgb,var(--accent) 13%,var(--card2));border-color:rgba(128,128,140,0.27);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.csum b.up,.creal b.up{color:var(--good)}.csum b.down,.creal b.down{color:var(--bad,#c9483c)}
.creal{margin:10px 0}
.creal table{width:100%;table-layout:fixed}
.creal th,.creal td{text-align:center;white-space:nowrap;padding-top:5px;padding-bottom:5px}
.creal th:first-child,.creal td:first-child{text-align:left;width:28%}
.creal th:first-child{text-transform:none;letter-spacing:0}
.creal tr:last-child td{font-weight:700}
.cform{margin-top:6px;text-align:center;line-height:1.6}
#calc .cnext{padding-top:8px}
#calc .thrt th,#calc .thrt td{text-align:center;padding-top:5px;padding-bottom:5px}
#calc .thrt .ok{color:var(--good);font-weight:700}
@media (max-width:700px){.csum{grid-template-columns:1fr 1fr}#calc .crow4{grid-template-columns:1fr 1fr}}

/* compact pass */
.cb-lgd>summary{cursor:pointer;font-size:12px;color:var(--muted);margin:4px 0}
.cb-lgd[open]>summary{margin-bottom:4px}
/* Kontak: header tabel customer tetap terlihat saat scroll ke bawah.
   Layar lebar: menempel di bawah bilah filter & tab (--te-stick diukur oleh mod.js).
   Layar sempit: tabel punya area scroll sendiri, header menempel di atasnya. */
.cb-list thead th{position:sticky;top:0;z-index:3;background:linear-gradient(var(--card2),var(--card2)),var(--bg1);box-shadow:inset 0 -1px 0 var(--line)}
@media(min-width:1000px){.cb-w:has(>table.cb-list){overflow:visible}.cb-list thead th{top:var(--te-stick,0px)}}
@media(max-width:999.98px){.cb-w:has(>table.cb-list){max-height:calc(100vh - var(--te-stick,0px) - 96px);overflow:auto;overscroll-behavior:contain}}
/* tooltip: solid background so the text behind it does not show through */
html .tipb{background:linear-gradient(var(--card2),var(--card2)),var(--bg1)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html .tipb::after{background:linear-gradient(var(--card2),var(--card2)),var(--bg1)!important}

<script data-o>const APP_VER="26.10.22-6",APP_LOG=[{"v":"26.10.22-6","d":"22 Okt 2026","items":["Grup otomatis: patokan target ND diambil dari nilai yang dipakai banyak sales (mis. 64K dan 34K); satu-dua sales dengan angka beda (sales baru atau target prorata) tidak lagi menggeser patokan sehingga V2/V3 tidak terlempar ke V1.",'Angka dari Lark seperti "64.000" terbaca 64.000.','Peringatan "pindah grup" kini menampilkan angka yang dibaca (target ND / Customer Count) supaya mudah dicek.']},{"v":"26.10.22-5","d":"22 Okt 2026","items":["Grup otomatis per orang memakai target Nett Deposit: target lebih besar (±64k) = V2/V3, lebih kecil (±32k) = V1. Kalau targetnya sama, Customer Count lebih sedikit = V2/V3, lebih banyak = V1.","Satu tab berisi V2/V3 dan V1 sekaligus kini dipisah dengan benar (tidak lagi disamakan ke grup mayoritas)."]},{"v":"26.10.22-4","d":"22 Okt 2026","items":["Grup otomatis tidak lagi memakai angka Customer Count tetap: dalam satu tempelan, Customer Count yang lebih kecil dibaca V2/V3 dan yang lebih besar V1, berapa pun jumlahnya bulan itu.","Kalau yang ditempel hanya satu tab, grup mengikuti grup anggota tim di bulan sebelumnya (dihitung terpisah untuk TradeWill dan Dana)."]},{"v":"26.10.22-3","d":"22 Okt 2026","items":["Tempel Bonus Progress: pilihan grup Tim C kini lengkap (BtcDana V2/V3, TradeWill V2/V3, TradeWill V1, BtcDana V1).","Grup otomatis lebih akurat: dibaca dari target ND per customer (V2/V3 ±160, V1 ±50), lalu target ND, jumlah customer, target active, dan terakhir grup bulan sebelumnya. Tidak lagi jatuh ke V1.","Kolom APP Dana otomatis masuk BtcDana; pilih grup manual hanya mengambil baris aplikasi yang sesuai."]},{"v":"26.10.22-2","d":"22 Okt 2026","items":["Tempel Bonus Progress: boleh satu sheet penuh berisi semua tim, hanya anggota tim ini yang diambil.","Tab Kontak: saat menempel sheet Customer Background, nama sales pemiliknya dikenali otomatis dari SID customer, dan bulannya diisi otomatis.","Tempel Bonus Progress: kalau satu tempelan berisi V2/V3 dan V1 sekaligus, grup ditentukan per orang (bukan disamakan semua)."]},{"v":"26.10.21-3","d":"21 Okt 2026","items":["Tooltip kembali hilang setelah kursor dipindah (sebelumnya tertahan muncul).","Tombol 🔗 Bagikan link di menu: link dashboard, Cek Foto Bukti, dan FU & Tugas untuk dibuka tim langsung di Chrome tanpa file."]},{"v":"26.10.21-2","d":"21 Okt 2026","items":["Tooltip (penjelasan saat kursor diarahkan) kini berlatar penuh, tidak tembus pandang, jadi mudah dibaca.","Tim C: file dashboard lama otomatis mendapat Password per grup seperti Tim E. Publish ditolak kalau data belum terkunci per grup."]},{"v":"26.10.21-1","d":"21 Okt 2026","items":["Dashboard bisa dibuka lewat file pembuka yang otomatis mengambil versi dan data terbaru (Tim C dan Tim E). Mode TL: tombol Publish di panel Update data."]},{"v":"26.10.20-5","d":"20 Okt 2026","items":["Tab Kontak: foto bukti yang memuat nomor customer lain milik orang yang sama (nama sama, akun lain) dihitung cocok.",'Kalau nomor HP customer kosong di Customer Background, foto berisi nomor customer lain (mis. riwayat panggilan) ditandai "Perlu dicek: mungkin nomor kedua", bukan langsung "Bukti milik customer lain".']},{"v":"26.10.20-4","d":"20 Okt 2026","items":["Tab Kontak: judul kolom tabel customer (SID, Nama, bulan, Status, Catatan) tetap terlihat saat scroll ke bawah."]},{"v":"26.10.20-3","d":"20 Okt 2026","items":["Mode TL: password cukup minimal 6 karakter untuk Publish. Data tab Kontak hanya ikut dikirim kalau password TL minimal 12 karakter."]},{"v":"26.10.20-2","d":"20 Okt 2026","items":['Team C: pilihan "Ingat password di Chrome ini" di layar masuk, jadi berikutnya langsung terbuka tanpa mengetik password.',"Mode TL: tombol Ganti password TL di kotak Publish langsung membuka formulir password."]},{"v":"26.10.20-1","d":"20 Okt 2026","items":["Team C: dashboard dibuka lewat file pembuka yang otomatis mengambil versi dan data terbaru, jadi tidak perlu download ulang setiap ada update.","Mode TL: tombol Publish di panel Update data untuk mengirim data terbaru ke tim. Data tetap terkunci password."]},{"v":"26.10.16-2","d":"16 Okt 2026","items":["Semua tab lebih ringkas: subjudul dan keterangan yang mengulang dihapus, daftar nama anggota tidak diulang di baris filter, ringkasan atas hanya 2 kotak (kotak Performance dan Perlu tindakan sudah ada di bawahnya).","Rumus ditulis dengan tanda kurung di semua tempat: kartu KPI, skema bonus, progress per orang (lengkap dengan Performance dan Komisi), tooltip grafik, istilah, dan simulasi.","Tab Tim: label tren cukup satu (mis. ▲▲ Membaik terus), legenda warna dihapus.","Tab Kontak: kolom yang isinya 0 untuk semua sales disembunyikan, filter yang jumlahnya 0 disembunyikan, arti kode bisa dibuka-tutup, daftar customer default 25 baris."]},{"v":"26.10.16-1","d":"16 Okt 2026","items":["Kalkulator bonus dibuat lebih ringkas: ringkasan Performance · Bonus data real · Tambahan · Total bonus dalam satu baris, tabel “Data real vs skenario” 5 baris (ND, customer aktif, lot, performance, bonus) dengan persentase di sampingnya, rumus dalam satu baris, dan tabel threshold yang lebih padat. Keterangan yang tidak perlu dihapus.","Kalkulator bonus: rumus ditulis dengan tanda kurung dan hasil tiap langkah, dan kurs default Rp 17.500."]},{"v":"26.10.14-2","d":"14 Okt 2026","items":["Cek Foto Bukti: pembacaan lebih akurat. SID/nomor yang sebagian terbaca (1–2 angka buram) tetap bisa dicocokkan, asal tidak mirip SID customer lain milik sales yang sama. Uji 300 foto: 93,3% → 97,3% cocok, tanpa salah cocok.","Cek Foto Bukti: sekitar 2× lebih cepat. Foto layar panjang/tipis dibaca jauh lebih cepat oleh pembaca kedua. Uji pada file sales asli: dalam 50 menit versi lama selesai 2 bulan, versi baru 4 bulan.","Cek Foto Bukti: foto lama yang dulu belum cocok dibaca ulang sekali dengan cara baru saat bulan itu dicek lagi."]},{"v":"26.10.14-1","d":"14 Okt 2026","items":["Team C: data dan skema bonus dikunci per grup (TradeWill V2/V3 dan TradeWill V1), sama seperti Team C. Anggota memilih grup dan memasukkan password grup; TL membuka semua dengan password Data TL."]},{"v":"26.10.13-3","d":"13 Okt 2026","items":["Team C: anggota BtcDana di file V1 masuk grup sendiri (BtcDana V1), terpisah dari TradeWill V1. Grup ini baru minta password saat ada anggotanya.","Team C: skema bonus juga dikunci per grup. Setiap grup hanya melihat skema bonusnya sendiri; TL melihat semua."]},{"v":"26.10.13-2","d":"13 Okt 2026","items":["Team C: data dikunci per grup (BtcDana V2/V3, TradeWill V2/V3, TradeWill V1). Saat file dibuka, anggota memilih grup dan memasukkan password grup, lalu hanya melihat data grupnya sendiri. Di dalam file tidak ada data anggota yang terbaca tanpa password.","TL membuka semua data dengan password Data TL, dan bisa mengganti password tiap grup di panel Update data.","Perbaikan filter grup: rekor, daftar anggota, dan kartu skema sekarang ikut grup yang dipilih."]},{"v":"26.10.13-1","d":"13 Okt 2026","items":["Dashboard yang belum punya data Customer Background (Team C, D, F) sekarang langsung punya tab Kontak saat masuk Data TL, sehingga alat Cek Foto Bukti bisa terhubung dan hasilnya masuk otomatis.","Data Kontak bisa dimulai dari nol: lewat alat Cek Foto Bukti, atau tempel / pilih file .xlsx di tab Kontak.","Hasil alat Cek Foto Bukti Team D (tanpa password) juga ikut masuk ke tab Kontak dashboard Team D."]},{"v":"26.10.12-9","d":"12 Okt 2026","items":["Alat Cek Foto Bukti Team D sekarang dipakai tanpa password: tidak ada layar password, dan Excel serta cadangan .tefoto tidak dikunci."]},{"v":"26.10.12-8","d":"12 Okt 2026","items":['Alat Cek Foto Bukti: tanda "⚠ berubah sejak dicek" sekarang tampil paling depan di kolom Status dan tidak lagi terpotong di layar laptop.',"Baru: dashboard dan alat Cek Foto Bukti untuk Team D."]},{"v":"26.10.12-7","d":"12 Okt 2026","items":["Baru: deteksi bukti yang diubah setelah dicek. Kalau file bulan yang sama dibaca lagi di alat Cek Foto Bukti, perubahan sejak pembacaan sebelumnya ditandai: foto bukti dihapus, foto diganti, contacted dicabut, channel dicabut, atau customer dihapus dari sheet.",'Tab Kontak: status baru "Diubah setelah dicek" (kotak merah tebal) dengan tanggal cek dan foto bukti lama tetap tersimpan; ikut di filter dan di pesan tindak lanjut ke sales.','Alat Cek Foto Bukti: tabel "Berubah sejak dicek sebelumnya" dengan foto lama, dan statusnya ikut di Excel arsip.']},{"v":"26.10.12-6","d":"12 Okt 2026","items":['Perbaikan utama: file hasil "Download HTML terbaru" bisa rusak sehingga hanya tampil ringkasan. Penyebabnya cara file disusun; sekarang file disusun ulang dengan cara yang aman, dan kode dari extension Chrome tidak ikut tersimpan.',"Sebelum disimpan, file hasil download dicek dulu; kalau tidak utuh, file tidak disimpan dan muncul pesan.","Data dari file yang rusak (versi sebelumnya) bisa diselamatkan: tarik file itu ke halaman versi ini."]},{"v":"26.10.12-5","d":"12 Okt 2026","items":['Perbaikan: "Download HTML terbaru" bisa menghasilkan file yang terpotong (lalu hanya tampil ringkasan) kalau Chrome menanyakan lokasi simpan. Sekarang file selalu tersimpan utuh.',"Kalau file yang dibuka ternyata terpotong, tampilan ringkas menyebutnya dengan jelas."]},{"v":"26.10.12-4","d":"12 Okt 2026","items":['Perbaikan: file hasil "Download HTML terbaru" kadang hanya menampilkan tampilan ringkas. Sekarang satu bagian yang bermasalah tidak lagi menghentikan seluruh dashboard; bagian itu ditandai dengan pemberitahuan kecil.',"Kalau data yang tersimpan di browser rusak, dashboard otomatis memakai data di dalam file."]},{"v":"26.10.12-3","d":"12 Okt 2026","items":["Tampilan ringkas (saat dashboard tidak bisa berjalan, misalnya di pratinjau) sekarang menyebut penyebabnya: JavaScript tidak aktif atau error tertentu.","Ditambah file tes pratinjau Lark untuk memastikan apakah Lark menjalankan dashboard."]},{"v":"26.10.12-2","d":"12 Okt 2026","items":["Tutup tahun: sekali klik membuat arsip lengkap tahun itu dan file kerja tahu
