<!DOCTYPE html>
<html lang="id" data-theme="light"><head>
<meta data-o charset="utf-8">
<meta data-o name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta data-o name="app-version" content="0.2.1">
<title data-o>FU & Tugas · Team E</title>
<style data-o>
:root{--bg:#eef2f9;--card:#fff;--card2:#f7f9fc;--line:#d5dcea;--ink:#141b2d;--mute:#5d6882;--acc:#3b5bdb;--acc2:#2e46ad;--pos:#1a7f4b;--warn:#b5760b;--neg:#c0392b;--soft:rgba(20,27,45,.05)}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141c2f;--card2:#18223a;--line:#2a3550;--ink:#f4f6fb;--mute:#8c97b0;--acc:#7c95ff;--acc2:#9db2ff;--pos:#34d08a;--warn:#e0a53a;--neg:#ff6b6b;--soft:rgba(255,255,255,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
.wrap{max-width:960px;margin:0 auto;padding:14px 16px 60px}
.hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hdr h1{font-size:18px;margin:0;flex:1;min-width:140px}
.hdr .who{font-size:12.5px;color:var(--mute)}
.btn{font:inherit;font-size:13.5px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:inherit;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;width:100%}
textarea{resize:vertical;min-height:62px}
label{font-size:12.5px;color:var(--mute);display:block;margin-bottom:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{font:inherit;font-size:13.5px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tabs button .b{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--neg);color:#fff;font-size:11px;line-height:17px;text-align:center}
.tabs button.on .b{background:rgba(255,255,255,.3)}
.center{min-height:72vh;display:grid;place-items:center}
.lbox{width:100%;max-width:380px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:120px}
.muted{color:var(--mute);font-size:12.5px}
.err{color:var(--neg);font-size:12.5px;margin-top:6px;min-height:1em}
.ok{color:var(--pos)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft)}
.pill.due{background:#fdebe9;color:var(--neg)}.pill.today{background:#fff4de;color:var(--warn)}.pill.up{background:#e8f0ff;color:var(--acc)}.pill.done{background:#e3f4ec;color:var(--pos)}
:root[data-theme="dark"] .pill.due{background:rgba(255,107,107,.18)}:root[data-theme="dark"] .pill.today{background:rgba(224,165,58,.18)}:root[data-theme="dark"] .pill.up{background:rgba(124,149,255,.18)}:root[data-theme="dark"] .pill.done{background:rgba(52,208,138,.18)}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--card2)}
.item.d{opacity:.6}
.item h4{margin:0 0 3px;font-size:14px}
.item .meta{font-size:12px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .txt{font-size:13.5px;margin:5px 0;white-space:pre-wrap}
.iact{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:13.5px}
.search{margin-bottom:10px}
.clist{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.crow{display:flex;gap:10px;align-items:center;padding:8px 11px;border-bottom:1px solid var(--line);cursor:pointer}
.crow:last-child{border-bottom:0}.crow:hover{background:var(--soft)}
.crow .nm{flex:1;font-size:13.5px}.crow .sid{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.crow.sel{background:var(--soft)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:999px;font-size:13px;z-index:90;max-width:90vw}
.off{position:fixed;left:12px;bottom:12px;z-index:50;font-size:12px;padding:5px 10px;border-radius:999px;background:#fff4d6;color:#6b4d0f;border:1px solid #f0d58a}
.banner{background:#fff7e6;border:1px solid #f3dfb1;color:#6b4d0f;border-radius:11px;padding:10px 13px;margin-bottom:12px;font-size:13.5px}
:root[data-theme="dark"] .banner{background:rgba(224,165,58,.12);color:var(--warn);border-color:rgba(224,165,58,.4)}
.banner b{display:block;margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.linkcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;background:var(--card2);text-decoration:none;color:inherit}
.linkcard:hover{border-color:var(--acc)}
.linkcard .ic{font-size:20px}.linkcard .t{flex:1}.linkcard .t b{display:block;font-size:14px}.linkcard .t span{font-size:12px;color:var(--mute)}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.chk input{width:auto}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.sub{font-size:12.5px;color:var(--mute);margin:-4px 0 10px}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.stat b{font-size:22px;display:block;line-height:1.15}.stat span{font-size:11.5px;color:var(--mute)}
.stat.alert b{color:var(--neg)}.stat.warn b{color:var(--warn)}.stat.good b{color:var(--pos)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip-f{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:inherit;cursor:pointer}
.chip-f.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.folder{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px;cursor:pointer;transition:border-color .15s,transform .1s;text-align:left;font:inherit;color:inherit}
.folder:hover{border-color:var(--acc);transform:translateY(-1px)}
.folder .fic{font-size:26px}.folder h4{margin:7px 0 2px;font-size:15px}.folder .cnt{font-size:12px;color:var(--mute)}
.crumb{font-size:13.5px;color:var(--acc);margin-bottom:10px;cursor:pointer;display:inline-block}
.sumrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card2);margin-bottom:7px}
.sumrow b{font-size:14px}.sumrow .n{font-size:13px;font-variant-numeric:tabular-nums;min-width:30px;text-align:center}
.bar{height:7px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--pos)}
.rnote{background:var(--soft);border-radius:8px;padding:6px 9px;font-size:12.5px;margin-top:5px}
.rnote b{font-size:11px;color:var(--mute);display:block}
.tlnote{border-left:3px solid var(--acc);padding:4px 9px;font-size:12.5px;margin-top:5px;background:var(--soft);border-radius:0 8px 8px 0}
</style>
</head>
<body>
<div data-o id="root" class="wrap"><div class="center"><div class="muted">Memuat…</div></div></div>
<noscript data-o>Alat ini perlu JavaScript. Buka di Google Chrome.</noscript>
<script data-o type="application/json" id="cfgseed">null</script>
<script data-o type="application/json" id="noteseed">{}</script>
<script data-o>
/* FU & Tugas Team E — core. Data model & crypto described in README of E-Team-Tasks-Reminder. */
"use strict";
const R=window.__FU_REMOTE||{owner:"",repo:"",dir:"fu",dataRepo:"E-Team-Tasks-Reminder",sha:null,offline:false,ver:"0.0.0"};
const TEAM=window.__FU_TEAM||{leader:"",members:[]};
const $=s=>document.querySelector(s),el=(t,a,h)=>{const e=document.createElement(t);if(a)for(const k in a)k==="class"?e.className=a[k]:k==="html"?e.innerHTML=a[k]:e.setAttribute(k,a[k]);if(h!=null)e.textContent=h;return e;};
const te=new TextEncoder(),td=new TextDecoder();
const b64=b=>{const a=new Uint8Array(b);let s="";for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s);};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const sha256=async s=>b64(await crypto.subtle.digest("SHA-256",te.encode(s)));
/* ---- crypto: PBKDF2 for passwords, raw AES keys wrapped as data ---- */
async function pkey(pw,salt){const b=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
async function encWith(key,bytes){const iv=rnd(12);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes);return {iv:b64(iv),ct:b64(ct)};}
async function decWith(key,e){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(e.iv)},key,ub64(e.ct));return new Uint8Array(pt);}
async function encPw(pw,bytes){const salt=rnd(16),k=await pkey(pw,salt),e=await encWith(k,bytes);return {salt:b64(salt),iv:e.iv,ct:e.ct};}
async function decPw(pw,e){const k=await pkey(pw,ub64(e.salt));return decWith(k,{iv:e.iv,ct:e.ct});}
async function rawKey(){return crypto.subtle.exportKey("raw",await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt","decrypt"]));}
async function impKey(raw){return crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt","decrypt"]);}
async function encJSON(key,obj){return encWith(key,te.encode(JSON.stringify(obj)));}
async function decJSON(key,e){return JSON.parse(td.decode(await decWith(key,e)));}

let CFG=null;        /* published team config (accounts, keys, seeded customers, tasks, links) */
let NOTES={};        /* raw note files loaded: {name: {obj, enc}} */
let ME=null;         /* {name, isTL, Km(CryptoKey)|null, Kteam(CryptoKey), Kmaster(CryptoKey)|null, pw} */
let TAB="fu", SELC=null, BOOTED=false;

try{CFG=JSON.parse($("#cfgseed").textContent);}catch(e){CFG=null;}
try{NOTES=JSON.parse($("#noteseed").textContent)||{};}catch(e){NOTES={};}

/* ================= rendering ================= */
function toast(t){const n=el("div",{class:"toast"},t);document.body.appendChild(n);setTimeout(()=>n.remove(),2600);}
function fmtDue(ms){if(!ms)return "";const d=new Date(ms),now=new Date(),day=864e5;const d0=new Date(d.getFullYear(),d.getMonth(),d.getDate()),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());const diff=Math.round((d0-t0)/day);const hhmm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");const lbl=d.toLocaleDateString("id-ID",{day:"numeric",month:"short"});return {lbl,hhmm,diff,ms};}
function dueState(ms){if(!ms)return null;const f=fmtDue(ms);if(ms<Date.now())return "due";if(f.diff===0)return "today";return "up";}
function render(){const r=$("#root");r.innerHTML="";if(!ME){return;}
 r.appendChild(hdr());
 const due=dueItems();
 if(due.length){const b=el("div",{class:"banner"});b.appendChild(el("b",null,"⏰ Perlu tindakan sekarang ("+due.length+")"));
  due.slice(0,6).forEach(x=>{const row=el("div",null);row.textContent="• "+x.label;b.appendChild(row);});
  if(due.length>6)b.appendChild(el("div",{class:"muted"},"…dan "+(due.length-6)+" lagi"));
  r.appendChild(b);}
 r.appendChild(tabsBar());
 const body=el("div");r.appendChild(body);
 if(TAB==="sum")summaryTab(body);else if(TAB==="fu")fuTab(body);else if(TAB==="task")taskTab(body);else if(TAB==="link")linkTab(body);else if(TAB==="tl")tlTab(body);
 updateBadges();
}
function hdr(){const h=el("div",{class:"hdr"});h.appendChild(el("h1",null,"FU & Tugas"));
 h.appendChild(el("div",{class:"who"},(ME.isTL?"TL · ":"")+ME.name+(R.offline?" · offline":"")));
 const t=el("button",{class:"btn sm ghost"},document.documentElement.dataset.theme==="dark"?"☀︎":"☾");t.onclick=()=>{const m=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=m;try{localStorage.setItem("fuTheme",m)}catch(e){}t.textContent=m==="dark"?"☀︎":"☾";};h.appendChild(t);
 const nb=el("button",{class:"btn sm ghost",title:"Izinkan notifikasi Chrome"},"🔔");nb.onclick=askNotif;h.appendChild(nb);
 const gb=el("button",{class:"btn sm ghost",title:"Panduan"},"?");gb.onclick=showGuide;h.appendChild(gb);
 const lo=el("button",{class:"btn sm ghost"},"Keluar");lo.onclick=logout;h.appendChild(lo);
 return h;}
function showGuide(){const steps=ME.isTL?["Tab Kelola → Buat kode aktivasi tiap anggota, berikan ke mereka.","Beri tugas (bisa berulang) dan isi link Lark dalam folder.","Klik Publish supaya tim mendapat perubahan.","Tab Ringkasan: pantau FU telat & tugas tiap anggota.","Reset password anggota = buat kode baru lalu Publish."]:["Tab Follow-up: tambah catatan FU + atur pengingat, atau pakai saran otomatis.","Tandai ✓ Selesai dan isi hasil singkat.","Tab Tugas: kerjakan tugas dari TL, tandai selesai.","Tab Lark: buka dokumen yang perlu diisi.","Klik 🔔 sekali agar dapat notifikasi saat jatuh tempo."];
 const ov=el("div",{class:"center",style:"position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:95;padding:16px"});const box=el("div",{class:"card",style:"max-width:440px;width:100%"});box.appendChild(el("b",null,"Panduan singkat"));const ol=el("ol",{style:"margin:10px 0 0;padding-left:20px;font-size:13.5px;line-height:1.7"});steps.forEach(s=>ol.appendChild(el("li",null,s)));box.appendChild(ol);const c=el("button",{class:"btn primary",style:"margin-top:12px"},"Mengerti");c.onclick=()=>ov.remove();box.appendChild(c);ov.appendChild(box);ov.onclick=e=>{if(e.target===ov)ov.remove();};document.body.appendChild(ov);}
function tabsBar(){const t=el("div",{class:"tabs"});
 const defs=[];if(ME.isTL)defs.push(["sum","Ringkasan"]);defs.push(["fu","Follow-up"],["task","Tugas"],["link","Lark"]);if(ME.isTL)defs.push(["tl","Kelola"]);
 defs.forEach(([k,l])=>{const b=el("button",{class:TAB===k?"on":""});b.appendChild(document.createTextNode(l));b.dataset.k=k;b.onclick=()=>{TAB=k;SELC=null;FOLDER=null;render();};t.appendChild(b);});
 return t;}
function updateBadges(){const c=counts();document.querySelectorAll(".tabs button").forEach(b=>{const k=b.dataset.k;const n=k==="fu"?c.fu:k==="task"?c.task:0;b.querySelectorAll(".b").forEach(x=>x.remove());if(n)b.appendChild(el("span",{class:"b"},String(n)));});
 const total=c.fu+c.task;document.title=(total?"("+total+") ":"")+"FU & Tugas · Team E";setFavBadge(total);}

/* ================= data helpers ================= */
function myNotes(name){name=name||ME.name;const n=NOTES[name]&&NOTES[name].obj;return n||{fu:[],status:{},at:0};}
function targets(){return ME.isTL?[ME.name].concat(TEAM.members.filter(m=>m!==ME.name)).filter((v,i,a)=>a.indexOf(v)===i):[ME.name];}
function myCustomers(name){name=name||ME.name;return (CFG&&CFG._cust&&CFG._cust[name])||[];}
/* recurring tasks: expand to the instance for a given day; one-off tasks pass through */
function ymd(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function taskKey(t,day){return t.repeat?t.id+"@"+(day||ymd()):t.id;}
function occursOn(t,d){if(!t.repeat)return true;const dow=d.getDay();if(t.repeat==="daily")return true;if(t.repeat==="weekdays")return dow>=1&&dow<=5;if(t.repeat==="weekly")return dow===(t.dow||1);return true;}
function dueMsFor(t,day){/* time-of-day for a recurring instance */if(!t.repeat)return t.due||0;const[Y,M,D]=day.split("-").map(Number);const d=new Date(Y,M-1,D);if(t.hm){const[h,mm]=t.hm.split(":").map(Number);d.setHours(h,mm,0,0);}else d.setHours(23,59,0,0);return d.getTime();}
function allTasksFor(name){name=name||ME.name;const ts=(CFG&&CFG._tasks)||[];return ts.filter(t=>ME.isTL||t.to==="ALL"||t.to===name||(Array.isArray(t.to)&&t.to.indexOf(name)>=0));}
/* active task instances for a member around now (today + overdue one-offs) */
function taskInstances(name){const out=[],today=ymd(),now=new Date();allTasksFor(name).forEach(t=>{
  if(!t.repeat){out.push({t,key:t.id,due:t.due||0,day:null});return;}
  if(occursOn(t,now))out.push({t,key:taskKey(t,today),due:dueMsFor(t,today),day:today});});
 return out;}
function taskDone(name,key){const st=myNotes(name).status||{};return !!st[key];}
function counts(){let fu=0,task=0;const nm=ME.name;myNotes(nm).fu.forEach(f=>{if(!f.done&&f.due&&f.due<Date.now()+864e5)fu++;});taskInstances(nm).forEach(i=>{if(!taskDone(nm,i.key)&&(!i.due||i.due<Date.now()+864e5))task++;});return {fu,task};}
function dueItems(){const out=[],nm=ME.name;myNotes(nm).fu.forEach(f=>{if(!f.done&&f.due&&f.due<=Date.now()){out.push({label:"FU "+(f.cust||"")+": "+f.text.slice(0,40),ms:f.due});}});taskInstances(nm).forEach(i=>{if(!taskDone(nm,i.key)&&i.due&&i.due<=Date.now())out.push({label:"Tugas: "+i.t.title,ms:i.due});});return out.sort((a,b)=>a.ms-b.ms);}
/* FU auto-suggestions: customers not contacted in >=3 months (from seeded lastCt=YYYY-MM) */
function staleCustomers(name){const list=myCustomers(name);if(!list.length)return [];const now=new Date(),cut=new Date(now.getFullYear(),now.getMonth()-2,1);const have=new Set(myNotes(name).fu.filter(f=>!f.done).map(f=>f.cust));
 return list.filter(c=>{if(!c.lastCt)return false;const[y,m]=c.lastCt.split("-").map(Number);return new Date(y,m-1,1)<cut&&!have.has((c.name||c.sid)+" · "+c.sid);}).slice(0,40);}
/* Lark link folders: normalize legacy flat arrays into one folder */
function folders(){let f=(CFG&&CFG._links)||[];if(Array.isArray(f)&&f.length&&f[0]&&f[0].url!==undefined){f=[{id:"f0",name:"Umum",icon:"📁",links:f}];CFG._links=f;}if(!Array.isArray(f))f=[];return f;}
let FOLDER=null;
/* TL summary numbers per member */
function memberStats(name){const n=myNotes(name);const now=Date.now();let fuDue=0,fuOpen=0;n.fu.forEach(f=>{if(f.done)return;fuOpen++;if(f.due&&f.due<=now)fuDue++;});
 const inst=taskInstances(name);let tOverdue=0,tOpen=0,tDone=0,tTot=inst.length;inst.forEach(i=>{if(taskDone(name,i.key))tDone++;else{tOpen++;if(i.due&&i.due<=now)tOverdue++;}});
 return {fuOpen,fuDue,tTot,tDone,tOpen,tOverdue,lastAt:n.at||0};}

/* ================= Summary tab (TL) ================= */
function summaryTab(root){
 const stats=TEAM.members.map(m=>({m,s:memberStats(m)}));
 const tot={fuDue:0,tOverdue:0,tOpen:0,tDone:0,tTot:0};stats.forEach(x=>{tot.fuDue+=x.s.fuDue;tot.tOverdue+=x.s.tOverdue;tot.tOpen+=x.s.tOpen;tot.tDone+=x.s.tDone;tot.tTot+=x.s.tTot;});
 const sr=el("div",{class:"statrow"});
 const stat=(n,l,c)=>{const d=el("div",{class:"stat"+(c?" "+c:"")});d.appendChild(el("b",null,String(n)));d.appendChild(el("span",null,l));return d;};
 sr.appendChild(stat(tot.fuDue,"FU telat (tim)",tot.fuDue?"alert":""));
 sr.appendChild(stat(tot.tOverdue,"Tugas telat",tot.tOverdue?"warn":""));
 sr.appendChild(stat(tot.tDone+"/"+tot.tTot,"Tugas selesai hari ini",tot.tTot&&tot.tDone===tot.tTot?"good":""));
 sr.appendChild(stat(TEAM.members.filter(m=>ENROLLED[m]).length+"/"+TEAM.members.length,"Anggota aktif",""));
 root.appendChild(sr);
 root.appendChild(el("div",{class:"sub"},"Klik nama untuk melihat follow-up & tugasnya."));

  const r=await fetch(API+path,{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},gh()),body:JSON.stringify(body)});
  if(r.ok)return true;let j=null;try{j=await r.json();}catch(e){}if(r.status===409&&i<2)continue;const e=new Error((j&&j.message)||("HTTP "+r.status));e.status=r.status;throw e;}}
async function fetchNotesFile(name){try{const r=await fetch(RAWD("notes/"+encodeURIComponent(name)+".json"),{cache:"no-store"});if(!r.ok)return null;return await r.json();}catch(e){return null;}}

/* ================= keys & accounts ================= */
async function codeKey(code,name){return pkey(code.trim().toUpperCase(),te.encode("fu-code|"+name));}
function newCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";const b=rnd(8);for(let i=0;i<8;i++)s+=A[b[i]%A.length];return s.slice(0,4)+"-"+s.slice(4);}
async function rsaEnc(spki,bytes){const k=await crypto.subtle.importKey("spki",ub64(spki),{name:"RSA-OAEP",hash:"SHA-256"},false,["encrypt"]);return b64(await crypto.subtle.encrypt({name:"RSA-OAEP"},k,bytes));}
async function rsaDec(pkcs8,ct){const k=await crypto.subtle.importKey("pkcs8",pkcs8,{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"]);return new Uint8Array(await crypto.subtle.decrypt({name:"RSA-OAEP"},k,ub64(ct)));}

/* decrypt the published config's shared parts once keys are known */
async function loadShared(kteam){CFG._tasks=[];CFG._links=[];
 try{if(CFG.tasks)CFG._tasks=await decJSON(kteam,CFG.tasks);}catch(e){}
 try{if(CFG.links)CFG._links=await decJSON(kteam,CFG.links);}catch(e){}}

/* ----- TL first-run setup: generate keypair + team key, publish empty config ----- */
async function tlSetup(pw,token){
 const kp=await crypto.subtle.generateKey({name:"RSA-OAEP",modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:"SHA-256"},true,["encrypt","decrypt"]);
 const pk=b64(await crypto.subtle.exportKey("spki",kp.publicKey));
 const sk=b64(await crypto.subtle.exportKey("pkcs8",kp.privateKey));
 const kteamRaw=rnd(32),kteam=await impKey(kteamRaw);
 REPO_TOKEN=token;
 const vault={sk,kteam:b64(kteamRaw),repoToken:token,custRaw:{}};
 ME={name:TEAM.leader,isTL:true,kteam,kteamRaw,sk:ub64(sk),pw,vault};
 CFG={fmt:1,pk,acct:{},cust:{},_tasks:[],_links:[]};
 const out={fmt:1,at:Date.now(),pk,vault:await encPw(pw,te.encode(JSON.stringify(vault))),_tokenSet:true,acct:{},cust:{},tasks:await encJSON(kteam,[]),links:await encJSON(kteam,[])};
 await ghPut("config.json",out,"init FU config");
 Object.assign(CFG,{vault:out.vault});CFG._cust={};NOTES={};saveLocal();
}

/* ----- TL login ----- */
async function tlLogin(pw){
 if(!CFG||!CFG.vault)throw {code:"nocfg"};
 let vault;try{vault=JSON.parse(td.decode(await decPw(pw,CFG.vault)));}catch(e){throw {code:"badpw"};}
 const kteamRaw=ub64(vault.kteam),kteam=await impKey(kteamRaw);
 REPO_TOKEN=vault.repoToken||null;
 ME={name:TEAM.leader,isTL:true,kteam,kteamRaw,sk:ub64(vault.sk),pw,vault};
 await loadShared(kteam);
 /* customers for TL shown per member via vault.custRaw */
 CFG._cust={};for(const nm in (vault.custRaw||{}))CFG._cust[nm]=vault.custRaw[nm];
 /* pull every member notes file so TL sees FU + task status */
 NOTES={};await Promise.all(TEAM.members.concat([TEAM.leader]).map(async nm=>{const f=await fetchNotesFile(nm);if(f)await ingestNotesTL(nm,f);}));
 /* mark enrolled accounts & let TL read member names list */
 CFG.acct=CFG.acct||{};
}
async function ingestNotesTL(nm,f){try{if(nm===TEAM.leader){/* TL own notes under kteam */const obj=f.data?await decJSON(ME.kteam,f.data):{fu:[],status:{}};NOTES[nm]={obj,enc:f};return;}
  if(!f.acct||!f.acct.kmTl)return;const kmRaw=await rsaDec(ME.sk,f.acct.kmTl);const km=await impKey(kmRaw);const obj=f.data?await decJSON(km,f.data):{fu:[],status:{}};NOTES[nm]={obj,enc:f,km,kmRaw};}catch(e){}}

/* ----- member login ----- */
async function memberLogin(name,pw){
 const f=await fetchNotesFile(name)||NOTES[name]&&NOTES[name].enc;
 if(!f||!f.acct||!f.acct.kmPw)throw {code:"needenroll"};
 let kmRaw;try{kmRaw=await decPw(pw,f.acct.kmPw);}catch(e){throw {code:"badpw"};}
 const km=await impKey(kmRaw);const kteamRaw=await decPw(pw,f.acct.kteamPw);const kteam=await impKey(kteamRaw);
 REPO_TOKEN=td.decode(await decWith(km,f.acct.tok));
 ME={name,isTL:false,km,kmRaw,kteam,kteamRaw,pw};
 const obj=f.data?await decJSON(km,f.data):{fu:[],status:{}};NOTES[name]={obj,enc:f,km,kmRaw};
 CFG._cust={};try{if(CFG.cust&&CFG.cust[name])CFG._cust[name]=await decJSON(km,CFG.cust[name]);}catch(e){}
 await loadShared(kteam);
}

/* ----- member enrollment (first login / after reset) ----- */
async function enroll(name,code,pw){
 const a=CFG&&CFG.acct&&CFG.acct[name];if(!a||!a.actHash)throw {code:"nocode"};
 if((await sha256(code.trim().toUpperCase()+"|"+name))!==a.actHash)throw {code:"badcode"};
 const ck=await codeKey(code,name);let kteamRaw,repoToken;
 try{kteamRaw=await decWith(ck,a.wrapKteam);repoToken=td.decode(await decWith(ck,a.wrapTok));}catch(e){throw {code:"badcode"};}
 const kmr=rnd(32),km=await impKey(kmr);
 const kmTl=await rsaEnc(CFG.pk,kmr);
 const tok=await encWith(km,te.encode(repoToken));
 const acct={kmPw:await encPw(pw,kmr),kteamPw:await encPw(pw,kteamRaw),tok,kmTl,enrolledAt:Date.now()};
 const data=await encJSON(km,{fu:[],status:{}});
 const file={fmt:1,at:Date.now(),acct,data};
 REPO_TOKEN=repoToken;
 await ghPut("notes/"+encodeURIComponent(name)+".json",file,"enroll "+name);
 NOTES[name]={obj:{fu:[],status:{}},enc:file,km,kmRaw:kmr};
 ME={name,isTL:false,km,kmRaw:kmr,kteam:await impKey(kteamRaw),kteamRaw,pw};
 CFG._cust={};try{if(CFG.cust&&CFG.cust[name])CFG._cust[name]=await decJSON(km,CFG.cust[name]);}catch(e){}
 await loadShared(ME.kteam);
}

async function publishConfig(msgEl){if(!ME.isTL)return;
 if(msgEl)msgEl.textContent="Menyiapkan…";
 try{
  /* rebuild vault with latest custRaw, token, tasks/links under kteam */
  const vault={sk:b64(ME.sk),kteam:b64(ME.kteamRaw),repoToken:REPO_TOKEN||ME.vault.repoToken,custRaw:ME.vault.custRaw||{}};
  if(CFG._tokenPlain){vault.repoToken=CFG._tokenPlain;REPO_TOKEN=CFG._tokenPlain;CFG._tokenPlain=null;}
  const out={fmt:1,at:Date.now(),pk:CFG.pk,vault:await encPw(ME.pw,te.encode(JSON.stringify(vault))),_tokenSet:!!vault.repoToken,
   acct:CFG.acct||{},cust:{},tasks:await encJSON(ME.kteam,CFG._tasks||[]),links:await encJSON(ME.kteam,CFG._links||[])};
  /* re-wrap code secrets for any pending accounts */
  for(const nm in (CFG.acct||{})){const a=CFG.acct[nm];if(a._plainCode){const ck=await codeKey(a._plainCode,nm);a.wrapKteam=await encWith(ck,ME.kteamRaw);a.wrapTok=await encWith(ck,te.encode(vault.repoToken||""));}const c=Object.assign({},a);delete c._plainCode;out.acct[nm]=c;}
  /* seed customers for enrolled members (needs their Km from their notes) */

  REPO_TOKEN=vault.repoToken;

  CFG=Object.assign(CFG,{acct:out.acct,cust:out.cust});DIRTY=false;saveLocal();
  if(msgEl)msgEl.textContent="✓ Terkirim. Tim mendapat perubahan saat membuka/refresh.";
 }catch(e){if(msgEl)msgEl.textContent="Gagal: "+(e.status===401?"token tidak berlaku":(e.message||e));}
}

/* ================= seed customers from a dashboard file ================= */
async function seedCustomers(file,msg){if(!file){return;}msg.textContent="Membaca file dashboard…";
 try{const t=await file.text(),doc=new DOMParser().parseFromString(t,"text/html");
  /* ask TL dashboard password to open the Customer Background blob */
  const cbEl=doc.getElementById("cbseed");if(!cbEl)throw new Error("Bukan file dashboard Team E.");
  const blob=JSON.parse(cbEl.textContent||"null");if(!blob)throw new Error("File ini belum ada data Kontak.");
  const pw=prompt("Password Data TL dashboard (untuk membuka daftar customer):");if(!pw)return;msg.textContent="Membuka…";
  const o=await decPw(pw,{salt:blob.salt,iv:blob.iv,ct:blob.ct}).catch(()=>null);
  if(!o)throw new Error("Password salah.");const cb=JSON.parse(td.decode(await unzlibAsync(ub64(JSON.parse(td.decode(o)).z))));
  const dc=f=>{const t=f%3,cr=Math.floor(f/3)%3,wa=Math.floor(f/9)%3,pc=Math.floor(f/27)%3,any=pc===1||wa===1||cr===1;return t!==2?t:(any?1:0);};
  const raw={};(cb.people||[]).forEach(p=>{const info={},order=[];const sheets=(p.sheets||[]).slice().sort((a,b)=>(a.ym||"").localeCompare(b.ym||""));
   sheets.forEach(s=>(s.rows||[]).forEach(r=>{const sid=p.ids[r[0]];if(!info[sid]){info[sid]={sid,name:(p.names&&p.names[r[0]])||"",vip:(p.vips&&p.vips[r[1]])||"",lastCt:""};order.push(sid);}if(dc(r[2])===1&&s.ym)info[sid].lastCt=s.ym;}));
   const list=order.map(sid=>info[sid]);if(list.length)raw[p.n]=list;});
  ME.vault.custRaw=raw;markDirty();msg.textContent="✓ "+Object.keys(raw).length+" sales terbaca ("+Object.values(raw).reduce((s,l)=>s+l.length,0)+" customer). Klik Publish untuk mengirim ke anggota yang sudah aktivasi.";
 }catch(e){msg.textContent="Gagal: "+(e.message||e);}
}

/* ================= remember-me (per device, key never leaves browser) ================= */
async function remDevKey(){const d=await idb();if(!d)return null;let k=await idbGet(d,"credKey");if(!k){k=await crypto.subtle.generateKey({name:"AES-GCM",length:256},false,["encrypt","decrypt"]);await idbPut(d,"credKey",k);}return k;}
function idb(){return new Promise(res=>{try{const q=indexedDB.open("fu_remote",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);}catch(e){res(null);}});}
function idbGet(d,k){return new Promise(res=>{try{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});}
function idbPut(d,k,v){return new Promise(res=>{try{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res();}});}
function idbDel(d,k){return new Promise(res=>{try{const t=d.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res();}});}
async function remSave(name,pw){try{const d=await idb(),k=await remDevKey();if(!k)return;const iv=rnd(12),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,te.encode(JSON.stringify({name,pw})));await idbPut(d,"cred",{iv:b64(iv),ct:b64(ct)});}catch(e){}}
async function remLoad(){try{const d=await idb();if(!d)return null;const c=await idbGet(d,"cred");if(!c)return null;const k=await idbGet(d,"credKey");if(!k)return null;const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(c.iv)},k,ub64(c.ct));return JSON.parse(td.decode(pt));}catch(e){return null;}}
async function remForget(){const d=await idb();if(d)await idbDel(d,"cred");}

 else{/* offline: load caches */try{const d=await idb();const nc=d&&await idbGet(d,"notesCache");if(nc){for(const nm in nc){NOTES[nm]={enc:nc[nm]};if(nc[nm].acct&&nc[nm].acct.kmPw)ENROLLED[nm]=true;}}const cc=d&&await idbGet(d,"cfgCache");if(cc&&!CFG)CFG=cc;}catch(e){}}
 showLogin();
})();
