<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="fu-loader" content="1"><meta name="app-version" content="0.2.1">
<title>FU & Tugas · Team E</title>
<style>
:root{--bg:#eef2f9;--ink:#141b2d;--mute:#5d6882;--acc:#3b5bdb;--line:#d5dcea}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--ink:#f4f6fb;--mute:#8c97b0;--acc:#7c95ff;--line:#2a3550}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.b{max-width:420px;text-align:center}
.sp{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:r .9s linear infinite;margin:0 auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
.m{color:var(--mute);font-size:13px;margin-top:6px}
</style></head>
<body><div class="w"><div class="b" id="box"><div class="sp" id="sp"></div><div id="msg">Memuat versi terbaru…</div><div class="m" id="sub"></div></div></div>
<script>
(async function(){
 var S={owner:"rivanworkspace",repo:"E-Team-Performance",branch:"main",dir:"fu",dataRepo:"rivanworkspace/E-Team-Tasks-Reminder",fuTeam:{"leader":"","members":[]},sha:null,offline:false};
 /* team names: built into the private file, or passed in a shared link (#t=Leader:Member1,Member2), then kept in this browser */
 try{var hm=/[#&]t=([^&]*)/.exec(location.hash);if(hm){var v=decodeURIComponent(hm[1]).split(":");S.fuTeam={leader:(v[0]||"").trim(),members:(v[1]||"").split(",").map(function(x){return x.trim();}).filter(Boolean)};localStorage.setItem("fuTeam",JSON.stringify(S.fuTeam));history.replaceState(null,"",location.pathname+location.search);}
  else if(!S.fuTeam.members.length)S.fuTeam=JSON.parse(localStorage.getItem("fuTeam")||"null")||S.fuTeam;}catch(e){}
 S.msg=function(t,sub,stop){document.getElementById("msg").textContent=t;document.getElementById("sub").textContent=sub||"";if(stop)document.getElementById("sp").style.display="none";};
 var dbp=null;function db(){if(!dbp)dbp=new Promise(function(res){try{var q=indexedDB.open("fu_remote",1);q.onupgradeneeded=function(){q.result.createObjectStore("kv");};q.onsuccess=function(){res(q.result);};q.onerror=function(){res(null);};}catch(e){res(null);}});return dbp;}
 S.idb={get:function(k){return db().then(function(d){if(!d)return null;return new Promise(function(res){try{var q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=function(){res(q.result==null?null:q.result);};q.onerror=function(){res(null);};}catch(e){res(null);}});});},
  put:function(k,v){return db().then(function(d){if(!d)return;return new Promise(function(res){try{var t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=function(){res();};t.onerror=function(){res();};}catch(e){res();}});});}};
 try{var r=await fetch("https://api.github.com/repos/"+S.owner+"/"+S.repo+"/commits/"+S.branch,{headers:{Accept:"application/vnd.github.sha"},cache:"no-store"});if(r.ok){var t=(await r.text()).trim();if(/^[0-9a-f]{40}$/.test(t))S.sha=t;}}catch(e){}
 S.raw=function(p){return "https://raw.githubusercontent.com/"+S.owner+"/"+S.repo+"/"+(S.sha||S.branch)+"/"+S.dir+"/"+p+(S.sha?"":"?t="+Date.now());};
 var boot=null;try{var b=await fetch(S.raw("boot.js"),{cache:"no-store"});if(b.ok){boot=await b.text();S.idb.put("boot",boot);}}catch(e){}
 if(!boot){boot=await S.idb.get("boot");S.offline=true;}
 if(!boot){S.msg("Alat belum bisa dimuat.","Periksa koneksi internet lalu refresh. Setelah sekali berhasil dibuka, alat ini juga bisa dibuka tanpa internet.",true);return;}
 try{(new Function("S",boot))(S);}catch(e){S.msg("Alat berhenti karena error.",String(e&&e.message||e).slice(0,160),true);}
})();
</script></body></html>
