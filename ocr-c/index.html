<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="te-loader" content="1">
<meta name="app-version" content="26.10.21-3">
<title>Cek Foto Bukti · Team C</title>
<style>
:root{--bg:#f5f6fa;--ink:#1d2433;--mute:#667085;--acc:#3b5bdb;--line:#d5d9e4}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--ink:#e6e8ee;--mute:#98a1b3;--acc:#7c95ff;--line:#2b3140}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.b{max-width:440px;text-align:center}
.sp{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:r .9s linear infinite;margin:0 auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
.m{color:var(--mute);font-size:13px;margin-top:6px}
</style></head>
<body><div class="w"><div class="b" id="teBox"><div class="sp" id="teSp"></div><div id="teMsg">Memuat versi terbaru…</div><div class="m" id="teSub"></div></div></div>
<script>
/* Team C loader: download this file once. Every time it opens it takes the newest dashboard and data from GitHub; offline it opens the last copy saved in this browser. */
(async function(){
 var S={owner:"rivanworkspace",repo:"Performance-Dashboard",branch:"main",dir:"ocr-c",team:"C",ns:"ocr-c:",people:[],sha:null,offline:false};
 var $=function(i){return document.getElementById(i);};
 /* names for tools that need them: built into a private file, or passed in a shared link (#p=…), then kept in this browser */
 try{var hm=/[#&]p=([^&]*)/.exec(location.hash);if(hm){S.people=decodeURIComponent(hm[1]).split(",").map(function(x){return x.trim();}).filter(Boolean);localStorage.setItem(S.ns+"people",JSON.stringify(S.people));history.replaceState(null,"",location.pathname+location.search);}
  else if(!S.people.length)S.people=JSON.parse(localStorage.getItem(S.ns+"people")||"[]");}catch(e){}
 S.msg=function(t,sub,stop){$("teMsg").textContent=t;$("teSub").textContent=sub||"";if(stop)$("teSp").style.display="none";};
 var dbp=null;function db(){if(!dbp)dbp=new Promise(function(res){try{var q=indexedDB.open("te_remote",1);q.onupgradeneeded=function(){q.result.createObjectStore("kv");};q.onsuccess=function(){res(q.result);};q.onerror=function(){res(null);};}catch(e){res(null);}});return dbp;}
 S.idb={get:async function(k){var d=await db();if(!d)return null;return new Promise(function(res){try{var q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=function(){res(q.result==null?null:q.result);};q.onerror=function(){res(null);};}catch(e){res(null);}});},
  put:async function(k,v){var d=await db();if(!d)return;return new Promise(function(res){try{var t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=function(){res();};t.onerror=function(){res();};}catch(e){res();}});},
  del:async function(k){var d=await db();if(!d)return;return new Promise(function(res){try{var t=d.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=function(){res();};t.onerror=function(){res();};}catch(e){res();}});}};
 /* repo renamed to Performance-Dashboard: use the new name once it exists, the old one until then (remembered) */
 var REPOS=[S.repo,"E-Team-Performance"]; for(var ri=0;ri<REPOS.length&&!S.sha;ri++){try{var r=await fetch("https://api.github.com/repos/"+S.owner+"/"+REPOS[ri]+"/commits/"+S.branch,{headers:{Accept:"application/vnd.github.sha"},cache:"no-store"});if(r.ok){var t=(await r.text()).trim();if(/^[0-9a-f]{40}$/.test(t)){S.sha=t;S.repo=REPOS[ri];try{localStorage.setItem("teRepo",S.repo);}catch(e){}}}}catch(e){}}
 if(!S.sha){try{var rk2=localStorage.getItem("teRepo");if(rk2)S.repo=rk2;else S.repo="E-Team-Performance";}catch(e){S.repo="E-Team-Performance";}}
 S.raw=function(p){return "https://raw.githubusercontent.com/"+S.owner+"/"+S.repo+"/"+(S.sha||S.branch)+"/"+S.dir+"/"+p+(S.sha?"":"?t="+Date.now());};
 var boot=null;try{var b=await fetch(S.raw("boot.js"),{cache:"no-store"});if(b.ok){boot=await b.text();S.idb.put(S.ns+"boot",boot);}}catch(e){}
 if(!boot){boot=await S.idb.get(S.ns+"boot");S.offline=true;}
 if(!boot){S.msg("Belum bisa dimuat.","Periksa koneksi internet, lalu refresh halaman ini. Setelah sekali berhasil dibuka, file ini juga bisa dibuka tanpa internet.",true);return;}
 try{(new Function("S",boot))(S);}catch(e){S.msg("Dashboard berhenti karena error.",String(e&&e.message||e).slice(0,160),true);}
})();
</script>
</body></html>
